<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - GYMORA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .auth-header {
      padding: 24px 16px 12px;
      text-align: center;
    }

    .auth-header .logo-wrap {
      width: 120px;
      height: 120px;
      margin: 0 auto;
    }

    .auth-header .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .auth-header .app-title {
      color: #FFD600;
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 800;
      margin-top: 8px;
    }

    .auth-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 20px 30px;
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
    }

    .auth-card {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .auth-card h2 {
      color: #FFD600;
      font-size: 22px;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #ccc;
      font-size: 13px;
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-card label {
      display: block;
      margin-top: 14px;
      font-size: 13px;
      color: #fff;
      font-weight: 600;
    }

    .auth-card input {
      width: 100%;
      box-sizing: border-box;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 13px 16px;
      color: #fff;
      font-size: 15px;
      margin-top: 5px;
      outline: none;
    }

    .auth-card input:focus {
      border-color: #FFD600;
    }

    .auth-card input::placeholder {
      color: #888;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 70px;
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
    }

    .auth-card .btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #FFD600;
      color: #000;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .auth-card .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg,
    .success-msg {
      display: none;
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
    }

    .error-msg {
      color: #ff5555;
    }

    .success-msg {
      color: #4caf50;
    }

    .show {
      display: block;
    }

    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #fff;
    }

    .auth-footer a {
      color: #FFD600;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="auth-page">

  <div class="auth-header">
    <div class="logo-wrap">
      <img src="gymora-logo.jpg" alt="GYMORA Logo">
    </div>

    <div class="app-title">GYMORA</div>
  </div>

  <div class="auth-body">

    <div class="auth-card">

      <h2>Create Account</h2>

      <p class="subtitle">
        Create your GYMORA account
      </p>

      <form id="registerForm">

        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          placeholder="Your name"
          required
        >

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="your@email.com"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle-pass"
            onclick="togglePassword('password', this)"
          >
            Show
          </button>
        </div>

        <label for="confirmPassword">Confirm Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Repeat your password"
            minlength="6"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle-pass"
            onclick="togglePassword('confirmPassword', this)"
          >
            Show
          </button>
        </div>

        <button type="submit" class="btn" id="registerBtn">
          Create Account
        </button>

      </form>

      <p class="error-msg" id="registerError"></p>
      <p class="success-msg" id="registerSuccess"></p>

    </div>

    <div class="auth-footer">
      Already have an account?
      <a href="login.html">Sign In</a>
    </div>

  </div>

</div>

<script type="module">

  import { auth, db } from "./firebase.js";

  import {
    createUserWithEmailAndPassword,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  window.togglePassword = function(inputId, btn) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {
      input.type = "text";
      btn.textContent = "Hide";
    } else {
      input.type = "password";
      btn.textContent = "Show";
    }

  };


  document
    .getElementById("registerForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const errorEl =
        document.getElementById("registerError");

      const successEl =
        document.getElementById("registerSuccess");

      const button =
        document.getElementById("registerBtn");


      errorEl.classList.remove("show");
      successEl.classList.remove("show");


      if (!name || !email || !password || !confirmPassword) {

        errorEl.textContent =
          "Please fill in all fields.";

        errorEl.classList.add("show");

        return;
      }


      if (password.length < 6) {

        errorEl.textContent =
          "Password must contain at least 6 characters.";

        errorEl.classList.add("show");

        return;
      }


      if (password !== confirmPassword) {

        errorEl.textContent =
          "Passwords do not match.";

        errorEl.classList.add("show");

        return;
      }


      button.disabled = true;
      button.textContent = "Creating Account...";


      try {

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user = userCredential.user;


        await updateProfile(user, {
          displayName: name
        });


        await setDoc(
          doc(db, "users", user.uid),
          {
            name: name,
            email: email,
            createdAt: serverTimestamp()
          }
        );


        successEl.textContent =
          "Account created successfully!";

        successEl.classList.add("show");


        setTimeout(() => {

          window.location.href = "index.html";

        }, 1000);


      } catch (error) {

        console.error(error);


        if (error.code === "auth/email-already-in-use") {

          errorEl.textContent =
            "This email is already registered.";

        } else if (error.code === "auth/invalid-email") {

          errorEl.textContent =
            "Please enter a valid email.";

        } else if (error.code === "auth/weak-password") {

          errorEl.textContent =
            "Password is too weak.";

        } else {

          errorEl.textContent =
            "Could not create account. Please try again.";

        }


        errorEl.classList.add("show");

        button.disabled = false;
        button.textContent = "Create Account";

      }

    });

</script>

</body>
</html>
