<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Workout - GYMORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="line-left"></div>
      <div class="logo-wrap">
        <img src="gymora-logo.jpg" alt="GYMORA Logo" />
      </div>
      <div class="line-right"></div>
    </div>
    <div class="app-title">GYMORA</div>
  </header>

  <nav class="nav-tabs">
    <a href="index.html">Home</a>
    <a href="workout.html" class="active">Workout</a>
    <a href="meals.html">Meals</a>
    <a href="progress.html">Progress</a>
    <a href="iagym.html">IA Gym</a>
  </nav>

  <main class="content">
    <div class="section-hero">
      <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=800&h=400&fit=crop" alt="Workout" />
      <div class="overlay"><h2>Log Your Workouts</h2></div>
    </div>

    <div class="card">
      <h3>🏋️ Select Equipment</h3>
      <div class="equip-grid" id="equipGrid"></div>
    </div>

    <div class="card">
      <h3>📝 Session Details</h3>
      <label>Selected Equipment</label>
      <input type="text" id="selectedEquip" readonly placeholder="Choose equipment above" />

      <label>Weight (kg)</label>
      <input type="number" id="weightInput" placeholder="e.g. 80" min="0" step="0.5" />

      <label>Reps</label>
      <input type="number" id="repsInput" placeholder="e.g. 12" min="1" />

      <label>Sets</label>
      <input type="number" id="setsInput" placeholder="e.g. 4" min="1" />

      <label>Notes</label>
      <textarea id="notesInput" rows="2" placeholder="Optional notes..."></textarea>

      <button class="btn" id="saveWorkoutBtn">💾 Save Workout</button>
    </div>

    <div class="card">
      <h3>📅 Workout History</h3>
      <div class="log-list" id="workoutLog">
        <p style="color:#666;font-size:13px;text-align:center;">No workouts logged yet</p>
      </div>
    </div>

    <p class="footer-note">GYMORA © 2026</p>
  </main>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
  <script>
    let selectedEquipment = null;

    async function initWorkoutPage() {
      await Gymora.openDatabase();
      renderEquipment();
      renderWorkouts();

      document.getElementById('saveWorkoutBtn').addEventListener('click', saveWorkout);
    }

    function renderEquipment() {
      const grid = document.getElementById('equipGrid');
      grid.innerHTML = Gymora.EQUIPMENT.map((eq, i) => `
        <div class="equip-item" data-index="${i}">
          <img src="${eq.img}" alt="${eq.name}" loading="lazy"
               onerror="this.src='https://via.placeholder.com/150x100/222/FFD600?text=${encodeURIComponent(eq.name)}'" />
          <p>${eq.name}</p>
        </div>
      `).join('');

      grid.querySelectorAll('.equip-item').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.index);
          selectedEquipment = Gymora.EQUIPMENT[idx];
          document.getElementById('selectedEquip').value = selectedEquipment.name;
          grid.querySelectorAll('.equip-item').forEach(e => e.classList.remove('selected'));
          el.classList.add('selected');
        });
      });
    }

    async function saveWorkout() {
      const equipment = document.getElementById('selectedEquip').value;
      const weight = document.getElementById('weightInput').value;
      const reps = document.getElementById('repsInput').value;
      const sets = document.getElementById('setsInput').value;
      const notes = document.getElementById('notesInput').value;

      if (!equipment || !weight || !reps || !sets) {
        Gymora.showToast('Please fill all required fields');
        return;
      }

      const entry = {
        equipment,
        weight: parseFloat(weight),
        reps: parseInt(reps),
        sets: parseInt(sets),
        notes: notes || '',
        date: Gymora.formatDate(),
        timestamp: Date.now()
      };

      try {
        await Gymora.addRecord('workouts', entry);
        Gymora.showToast('Workout saved ✓');
        document.getElementById('weightInput').value = '';
        document.getElementById('repsInput').value = '';
        document.getElementById('setsInput').value = '';
        document.getElementById('notesInput').value = '';
        renderWorkouts();
      } catch (err) {
        console.error(err);
        Gymora.showToast('Error saving workout');
      }
    }

    async function renderWorkouts() {
      const log = document.getElementById('workoutLog');
      try {
        const workouts = await Gymora.getAllRecords('workouts');
        workouts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        if (workouts.length === 0) {
          log.innerHTML = '<p style="color:#666;font-size:13px;text-align:center;">No workouts logged yet</p>';
          return;
        }

        log.innerHTML = workouts.slice(0, 20).map(w => `
          <div class="log-item">
            <div class="info">
              <strong>${w.equipment}</strong>
              ${w.weight} kg × ${w.reps} reps × ${w.sets} sets
              ${w.notes ? `<br><span style="color:#888;font-size:11px;">${w.notes}</span>` : ''}
            </div>
            <div class="meta">${w.date}</div>
          </div>
        `).join('');
      } catch (err) {
        log.innerHTML = '<p style="color:#666;font-size:13px;text-align:center;">Could not load history</p>';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWorkoutPage);
    } else {
      initWorkoutPage();
    }
  </script>
</body>
</html>
