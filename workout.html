<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Workout - GYMORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="line-left"></div>
      <div class="logo-wrap">
        <img src="./logo.png.jpg" alt="GYMORA" class="gymora-logo">
      </div>
      <div class="line-right"></div>
    </div>
    <div class="app-title">GYMORA</div>
  </header>

  <nav class="nav-tabs">
    <a href="index.html">Home</a>
    <a href="workout.html" class="active">Workout</a>
    <a href="meals.html">Meals</a>
    <a href="progress.html">Progress</a>
    <a href="iagym.html">IA Gym</a>
  </nav>

  <main class="content">
    <div class="section-hero">
      <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=800&h=400&fit=crop" alt="Workout" />
      <div class="overlay"><h2>Log Your Workouts</h2></div>
    </div>

    <div class="card">
      <h3>🏋️ Select Equipment</h3>
      <div class="equip-grid" id="equipGrid"></div>
    </div>

    <div class="card">
      <h3>📝 Session Details</h3>
      <label>Selected Equipment</label>
      <input type="text" id="selectedEquip" readonly placeholder="Choose equipment above" />

      <label>Weight (kg)</label>
      <input type="number" id="weightInput" placeholder="e.g. 80" min="0" step="0.5" />

      <label>Reps</label>
      <input type="number" id="repsInput" placeholder="e.g. 12" min="1" />

      <label>Sets</label>
      <input type="number" id="setsInput" placeholder="e.g. 4" min="1" />

      <label>Notes</label>
      <textarea id="notesInput" rows="2" placeholder="Optional notes..."></textarea>

      <button class="btn" id="saveWorkoutBtn">💾 Save Workout</button>
    </div>

    <div class="card">
      <h3>📅 Workout History</h3>
      <div class="log-list" id="workoutLog">
        <p style="color:#666;font-size:13px;text-align:center;">No workouts logged yet</p>
      </div>
    </div>

    <p class="footer-note">GYMORA © 2026</p>
  </main>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
  
<script type="module">
  import { auth, db } from "./firebase.js";
  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    collection,
    addDoc,
    getDocs,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  let selectedEquipment = null;
  let currentUser = null;
  let authReady = false;

  const $ = (id) => document.getElementById(id);

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function showMessage(message) {
    if (window.Gymora?.showToast) {
      window.Gymora.showToast(message);
    } else {
      alert(message);
    }
  }

  function getWorkoutCollection() {
    if (!currentUser) {
      throw new Error("Please sign in first.");
    }

    return collection(db, "users", currentUser.uid, "workouts");
  }

  function renderEquipment() {
    const grid = $("equipGrid");

    if (!window.Gymora?.EQUIPMENT) {
      grid.innerHTML = "<p>Equipment could not be loaded. Please refresh.</p>";
      return;
    }

    grid.innerHTML = Gymora.EQUIPMENT.map((eq, i) => `
      <div class="equip-item" data-index="${i}">
        <img
          src="${escapeHTML(eq.img)}"
          alt="${escapeHTML(eq.name)}"
          loading="lazy"
          onerror="this.onerror=null;this.src='https://placehold.co/150x100/222/FFD600?text=Equipment';"
        />
        <p>${escapeHTML(eq.name)}</p>
      </div>
    `).join("");

    grid.querySelectorAll(".equip-item").forEach((el) => {
      el.addEventListener("click", () => {
        selectedEquipment = Gymora.EQUIPMENT[Number(el.dataset.index)];
        $("selectedEquip").value = selectedEquipment.name;

        grid.querySelectorAll(".equip-item").forEach((item) => {
          item.classList.remove("selected");
        });

        el.classList.add("selected");
      });
    });
  }

  async function saveWorkout() {
    if (!authReady) {
      showMessage("Please wait while your account loads.");
      return;
    }

    if (!currentUser) {
      showMessage("Please log in before saving workouts.");
      window.location.href = "login.html";
      return;
    }

    const equipment = $("selectedEquip").value.trim();
    const weightText = $("weightInput").value;
    const repsText = $("repsInput").value;
    const setsText = $("setsInput").value;
    const notes = $("notesInput").value.trim();

    const weight = Number(weightText);
    const reps = Number(repsText);
    const sets = Number(setsText);

    if (
      !equipment ||
      weightText === "" ||
      repsText === "" ||
      setsText === "" ||
      !Number.isFinite(weight) ||
      weight < 0 ||
      !Number.isInteger(reps) ||
      reps < 1 ||
      !Number.isInteger(sets) ||
      sets < 1
    ) {
      showMessage("Enter valid equipment, weight, reps and sets.");
      return;
    }

    const button = $("saveWorkoutBtn");
    button.disabled = true;

    try {
      const now = new Date();

      await addDoc(getWorkoutCollection(), {
        equipment,
        weight,
        reps,
        sets,
        notes,
        date: now.toLocaleDateString("en-GB"),
        timestamp: Date.now(),
        createdAt: serverTimestamp()
      });

      showMessage("Workout saved to your account!");

      $("weightInput").value = "";
      $("repsInput").value = "";
      $("setsInput").value = "";
      $("notesInput").value = "";

      await renderWorkouts();
    } catch (error) {
      console.error("Save workout error:", error);
      showMessage(
        error.code === "permission-denied"
          ? "Permission denied. Check your Firestore rules."
          : "Could not save workout. Check your connection and try again."
      );
    } finally {
      button.disabled = false;
    }
  }

  async function renderWorkouts() {
    const log = $("workoutLog");

    if (!currentUser) {
      log.innerHTML =
        '<p style="color:#999;text-align:center;">Log in to view your workout history.</p>';
      return;
    }

    log.innerHTML =
      '<p style="color:#999;text-align:center;">Loading workouts...</p>';

    try {
      const snapshot = await getDocs(getWorkoutCollection());

      const workouts = snapshot.docs.map((doc) => ({
        id: doc.id,
        ...doc.data()
      }));

      workouts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      if (workouts.length === 0) {
        log.innerHTML =
          '<p style="color:#666;font-size:13px;text-align:center;">No workouts saved yet.</p>';
        return;
      }

      log.innerHTML = workouts.slice(0, 50).map((w) => `
        <div class="log-item">
          <div class="info">
            <strong>${escapeHTML(w.equipment)}</strong><br>
            ${escapeHTML(w.weight)} kg ×
            ${escapeHTML(w.reps)} reps ×
            ${escapeHTML(w.sets)} sets
            ${w.notes
              ? `<br><span style="color:#888;font-size:11px;">${escapeHTML(w.notes)}</span>`
              : ""}
          </div>
          <div class="meta">${escapeHTML(w.date || "")}</div>
        </div>
      `).join("");
    } catch (error) {
      console.error("Load workouts error:", error);
      log.innerHTML =
        '<p style="color:#c66;text-align:center;">Could not load workouts. Please refresh.</p>';
    }
  }

  $("saveWorkoutBtn").addEventListener("click", saveWorkout);
  renderEquipment();

  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    authReady = true;
    await renderWorkouts();
  });
</script>
</body>
</html>
